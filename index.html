<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>The Bug Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;700;900&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Lato;
text-align:center;
}

h1{
font-size:clamp(28px,6vw,42px);
margin-top:15px;
}

#box{
border:3px solid white;
padding:18px;
margin:15px auto;
width:92%;
max-width:520px;
font-size:clamp(20px,4vw,26px);
font-weight:900;
}

#game{padding:15px}

button{
padding:14px 18px;
margin:8px;
font-size:clamp(16px,3.8vw,20px);
background:white;
color:black;
border:none;
cursor:pointer;
border-radius:12px;
width:90%;
max-width:350px;
}

button:hover{opacity:.85}

.card{
display:inline-block;
width:clamp(130px,35vw,190px);
height:clamp(130px,35vw,190px);
border:3px solid white;
margin:10px;
font-size:clamp(32px,7vw,52px);
padding-top:10px;
}

.hidden{display:none}

#endScreen{
font-size:clamp(32px,7vw,46px);
margin-top:25px;
}

#playAgain{
font-size:clamp(22px,5vw,30px);
padding:18px 30px;
width:auto;
}

/* Desktop layout improvement */
@media(min-width:700px){
#game{max-width:900px;margin:auto}
button{width:auto;min-width:180px}
}
</style>
</head>

<body>

<h1>The Bug Test</h1>

<div id="box">
Score: <span id="score">0</span><br>
Time Left: <span id="time">900</span>s
</div>

<div id="game"></div>

<div id="endScreen" class="hidden">
<span id="endText"></span><br><br>
<button id="playAgain" onclick="startGame()">PLAY AGAIN</button>
</div>

<script>
let originalQuestions=[
{type:"odd",q:"Find the odd one out",options:["Airplane","Banana","Ball","Bike"],answer:"Airplane"},
{type:"spotOwl",q:"Spot the difference",options:["The moon has vanished","There are only two claws","The owl is a different colour"],answer:"There are only two claws"},
{type:"wrongSteps",q:"Choose the wrong step",steps:["Add a bit of salt in it","Clean land","Build frame","Build a base","Add roof","Turn on lights","Add electricity","Add doors/windows","Add water system","House ready","Paint house","Finish floors"],options:["Add a bit of salt in it","Finish floors","Clean land","Build a base"],answer:"Add a bit of salt in it"},
{type:"odd",q:"Find the odd one out",options:["Rain","Rat","Rope","Sunflower"],answer:"Sunflower"},
{type:"spotCat",q:"Spot the difference",options:["There are two extra paws","There are two extra eyes","There are only two whiskers"],answer:"There are only two whiskers"},
{type:"wrongSteps",q:"Choose the wrong step",steps:["Mix atta with baking powder and soda","Gather the ingredients","Let it bake for 30 minutes","Mix curd, oil, and jaggery together","Put the cake in an airfryer","The cake is ready","Pour the batter out of the window","Wait for 10 - 15 mins","Mix the dry mix with the wet mix","Line the baking cup with oil"],options:["Line the baking cup with oil","Gather the ingredients","Pour the batter out of the window"],answer:"Pour the batter out of the window"}
];

let questions=[],score,time,current,startTime,timer;

function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}

function startGame(){
questions=shuffle(originalQuestions);
score=0; time=900; current=0;
document.getElementById("score").innerText=0;
document.getElementById("time").innerText=900;
document.getElementById("endScreen").classList.add("hidden");
clearInterval(timer);
timer=setInterval(updateTime,1000);
startTime=Date.now();
nextQ();
}

function updateTime(){
time--;
document.getElementById("time").innerText=time;
if(time<=0) loseGame();
}

function addScore(){
let speed=Math.floor((Date.now()-startTime)/1000);
score+=Math.max(60-speed,15);
document.getElementById("score").innerText=score;
startTime=Date.now();
}

function nextQ(){
if(current>=questions.length){winGame();return}
let q=questions[current];
let game=document.getElementById("game");
game.innerHTML="<h2>"+q.q+"</h2>";

if(q.type==="spotOwl"){
game.innerHTML+=`<div class="card">🌕<br>🌳<br>🦉<br>🦶🦶🦶</div>
<div class="card">🌕<br>🌳<br>🦉<br>🦶🦶</div><br>`;
}

if(q.type==="spotCat"){
game.innerHTML+=`<div class="card">🌳<br>🐱<br>≋≋≋</div>
<div class="card">🌳<br>🐱<br>≋≋</div><br>`;
}

if(q.type==="wrongSteps"){
game.innerHTML+="<p>"+q.steps.join("<br>")+"</p>";
}

q.options.forEach(opt=>{
let btn=document.createElement("button");
btn.innerText=opt;
btn.onclick=()=>checkAnswer(opt);
game.appendChild(btn);
});
}

function checkAnswer(ans){
let q=questions[current];
if(ans===q.answer){ addScore(); current++; nextQ(); }
else loseGame();
}

function loseGame(){
clearInterval(timer);
document.querySelectorAll("#game button").forEach(b=>b.disabled=true);
document.getElementById("endText").innerText="GAME OVER";
document.getElementById("endScreen").classList.remove("hidden");
}

function winGame(){
clearInterval(timer);
document.querySelectorAll("#game button").forEach(b=>b.disabled=true);
document.getElementById("endText").innerText="🎉 YOU WON 🎉";
document.getElementById("endScreen").classList.remove("hidden");
}

startGame();
</script>

</body>
</html>
